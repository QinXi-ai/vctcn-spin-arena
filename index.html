<header><div class="brand"><span class="mark" aria-hidden="true"></span>VCTCN<span style="color:#7d897e;font-weight:500">/</span>ARENA</div><div class="header-note">旋转 · 抽打 · 碰撞</div><div class="edition">SPIN LAB — 004</div></header>
<main><div class="intro"><div><div class="eyebrow">THE SPIN NEVER STOPS</div><h1>陀螺竞技场</h1><p>四个陀螺，一场不停歇的碰撞。</p></div><div class="live"><i></i><span id="liveLabel">LIVE SIMULATION</span></div></div>
<div class="layout"><section class="arena" aria-label="陀螺竞技场"><div class="arena-top"><div class="arena-tag"><b>01</b> &nbsp;/&nbsp; COLLISION ZONE</div><div class="coords">VCTCN EXPERIMENTAL FIELD</div></div><div class="event" id="event" aria-live="polite"></div><canvas id="arena" tabindex="0" aria-label="TYL、JDG、EDG、XLG 四个旋转陀螺。点击场地抽打最近的陀螺，按空格全部抽打，P 键暂停。"></canvas><div class="arena-bottom"><div class="hint"><span class="cross">⌖</span>点击场地，挥鞭加速 <span class="key">SPACE</span></div><span class="arena-tag" id="fieldStatus">4 TOPS IN PLAY</span></div></section>
<aside class="controls" aria-label="竞技场控制"><div class="section-label">掌控旋转<span>CONTROL PANEL</span></div><button class="primary" id="strike"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m14 2-9 12h7l-2 8 9-13h-7z"/></svg>全部抽打</button><div class="control-note">给每个陀螺注入新的动能</div><div class="toggle-row"><label id="autoLabel">自动抽打</label><button id="auto" class="switch" role="switch" aria-checked="true" aria-labelledby="autoLabel"></button></div><div class="range-block"><div class="range-head"><label for="power">抽打力度</label><output id="powerValue" for="power">70%</output></div><input id="power" type="range" min="20" max="100" value="70" step="5"><div class="range-labels"><span>轻推</span><span>全力</span></div></div><hr class="divider"><div class="stats"><div class="stat"><small>碰撞次数</small><div id="collisions">0</div></div><div class="stat"><small>运行时间</small><div><span id="time">00:00</span></div></div></div><hr class="divider"><button id="sound" class="sound" aria-pressed="false"><span aria-hidden="true">♫</span><span id="soundLabel">音效关闭</span></button><div class="secondary-row"><button class="secondary" id="pause">Ⅱ 暂停</button><button class="secondary" id="reset">↻ 重置</button></div></aside></div>
<section class="roster" aria-label="陀螺实时状态" id="roster"></section><footer><span>VCTCN / KINETIC PLAYGROUND</span><span class="footer-cn">每一次碰撞，都是新的方向。</span><a href="https://github.com/rootmapavri/amxmodx-valorant-kill-sounds" target="_blank" rel="noopener noreferrer" style="color:#a0ad9d;letter-spacing:0;font-size:12px">击杀音效来源</a></footer></main>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),canvas=$('#arena'),ctx=canvas.getContext('2d');
const colors=['#c8ff62','#ae9aff','#ff9968','#75d9ed'];const names=['TYL','JDG','EDG','XLG'];
const whipNames={TYL:'TL',XLG:'NS',EDG:'GE',JDG:'T1'};
let width=900,height=530,scale=1,elapsed=0,collisionCount=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,auto=true,power=.7,sound=false,audio=null,whips=[],sparks=[],rings=[],tops=[],autoClock=0,last=0,uiClock=0,flash=0;
const roster=$('#roster');roster.innerHTML=colors.map((c,i)=>`<article class="top-card" style="--top:${c}"><div class="card-head"><span class="top-name"><i></i>${names[i]}</span><span class="number">鞭子 · ${whipNames[names[i]]}</span></div><div class="rpm" id="rpm${i}">0<span>RPM</span></div><div class="energy"><span id="energy${i}"></span></div><div class="card-foot"><span>旋转能量</span><b id="state${i}">高速旋转</b></div></article>`).join('');
function resize(){const rect=canvas.getBoundingClientRect();width=rect.width;height=rect.height;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=width*dpr;canvas.height=height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(width/620,(height-100)/450);}
function reset(){elapsed=0;collisionCount=0;autoClock=0;whips=[];sparks=[];rings=[];tops=colors.map((color,i)=>{const a=i*Math.PI/2+.4;return {id:i,color,x:Math.cos(a)*135,y:Math.sin(a)*135,vx:-Math.cos(a)*75+Math.sin(a)*38,vy:-Math.sin(a)*75-Math.cos(a)*38,angle:i*1.4,omega:24+i*2,r:43,trail:[],hit:0};});updateUI();}
function burst(x,y,color,n=16){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=40+Math.random()*160;sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.25+Math.random()*.3,max:.55,color});}rings.push({x,y,r:12,life:.4,color});}
let killBuffers=[],audioLoading=null,lastSound=-10,lastPlayed=null,soundSources=new Set();
function loadSounds(){return audioLoading??=Promise.all([1,2,3,4,5].map(async n=>{const response=await fetch(`audio/kill${n}.wav`);if(!response.ok)throw new Error('音效文件加载失败');return audio.decodeAudioData(await response.arrayBuffer());})).then(buffers=>{killBuffers=buffers;}).catch(error=>{audioLoading=null;throw error;});}
function tone(freq){if(!sound||!audio||!killBuffers.length||audio.currentTime-lastSound<.25||freq===100)return;lastSound=audio.currentTime;const index=freq>=350?Math.max(0,collisionCount-1)%5:0;const source=audio.createBufferSource(),gain=audio.createGain();source.buffer=killBuffers[index];gain.gain.value=.38;source.connect(gain);gain.connect(audio.destination);source.onended=()=>soundSources.delete(source);soundSources.add(source);source.start();lastPlayed=index+1;}
function strike(t,manual=false){const a=Math.atan2(-t.y,-t.x)+(Math.random()-.5)*1.4;const impulse=75+power*110;t.vx+=Math.cos(a)*impulse;t.vy+=Math.sin(a)*impulse;let speed=Math.hypot(t.vx,t.vy);if(speed>240){t.vx*=240/speed;t.vy*=240/speed;}t.omega=Math.min(64,t.omega+12+power*20);t.hit=.3;const side=t.x>0?1:-1;const limitX=width/(2*scale)-45,limitY=(height/2-100)/(scale*.78);whips.push({x:t.x,y:t.y,sx:Math.max(-limitX,Math.min(limitX,t.x+side*180)),sy:Math.max(-limitY,t.y-145),life:.72,max:.72,color:t.color,name:whipNames[names[t.id]],target:names[t.id]});burst(t.x,t.y,t.color,12);tone(200+100*power);$('#event').textContent=`${whipNames[names[t.id]]} 抽打 ${names[t.id]} · 加速`;flash=manual?1.3:.9;}
function strikeAll(){if(paused)setPaused(false);tops.forEach(t=>strike(t));$('#event').textContent='全场抽打 · 动能注入';flash=1.3;updateUI();}
function setPaused(v){paused=v;$('#pause').textContent=paused?'▷ 继续':'Ⅱ 暂停';$('#liveLabel').textContent=paused?'SIMULATION PAUSED':'LIVE SIMULATION';$('#fieldStatus').textContent=paused?'PAUSED / 已暂停':'4 TOPS IN PLAY';}
function updateUI(){tops.forEach((t,i)=>{const rpm=Math.round(t.omega*60/(Math.PI*2));$(`#rpm${i}`).innerHTML=`${rpm}<span>RPM</span>`;$(`#energy${i}`).style.width=`${t.omega/64*100}%`;$(`#state${i}`).textContent=t.omega>30?'高速旋转':t.omega>10?'稳定旋转':'缓慢旋转';});$('#collisions').textContent=collisionCount;const n=Math.floor(elapsed);$('#time').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
function step(dt){elapsed+=dt;autoClock+=dt;if(auto&&autoClock>1.05){autoClock=0;strike(tops[Math.floor(elapsed/1.05)%4]);}for(const t of tops){t.omega=Math.max(.4,t.omega*Math.exp(-.058*dt));t.angle+=t.omega*dt;t.vx*=Math.exp(-.13*dt);t.vy*=Math.exp(-.13*dt);t.x+=t.vx*dt;t.y+=t.vy*dt;t.hit=Math.max(0,t.hit-dt);const bound=211,d=Math.hypot(t.x,t.y);if(d>bound){const nx=t.x/d,ny=t.y/d;t.x=nx*bound;t.y=ny*bound;const dot=t.vx*nx+t.vy*ny;if(dot>0){t.vx-=1.85*dot*nx;t.vy-=1.85*dot*ny;burst(t.x+nx*t.r,t.y+ny*t.r,t.color,7);tone(100,.018);}}t.trail.push({x:t.x,y:t.y});if(t.trail.length>30)t.trail.shift();}
for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){const a=tops[i],b=tops[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r;if(d<min){const nx=d?dx/d:1,ny=d?dy/d:0,over=(min-d)/2;a.x-=nx*over;a.y-=ny*over;b.x+=nx*over;b.y+=ny*over;const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){const imp=-(1.0+.93)*rv/2;a.vx-=imp*nx;a.vy-=imp*ny;b.vx+=imp*nx;b.vy+=imp*ny;const kick=(a.omega+b.omega)*.16;a.vx-=ny*kick;a.vy+=nx*kick;b.vx+=ny*kick;b.vy-=nx*kick;a.omega*=.97;b.omega*=.97;a.hit=b.hit=.15;collisionCount++;burst((a.x+b.x)/2,(a.y+b.y)/2,'#edf7c9',20);tone(350,.045);}}}
whips=whips.filter(w=>(w.life-=dt)>0);sparks=sparks.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;return(p.life-=dt)>0;});rings=rings.filter(r=>{r.r+=dt*140;return(r.life-=dt)>0;});flash=Math.max(0,flash-dt);uiClock+=dt;if(uiClock>.15){updateUI();uiClock=0;}}
function circle(x,y,r,fill,stroke,line=1){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke();}}
function drawField(){ctx.clearRect(0,0,width,height);const glow=ctx.createRadialGradient(width*.48,height*.48,10,width*.48,height*.5,width*.65);glow.addColorStop(0,'#28322a');glow.addColorStop(1,'#151c1a');ctx.fillStyle=glow;ctx.fillRect(0,0,width,height);ctx.save();ctx.translate(width/2,height/2+8);ctx.scale(scale,scale*.78);circle(0,12,270,'#101612','#111711',5);circle(0,0,271,'#1d271f','#4a5546',2);circle(0,0,256,'#1d261e','#68735b',1);ctx.save();ctx.beginPath();ctx.arc(0,0,252,0,Math.PI*2);ctx.clip();ctx.strokeStyle='#43513c33';ctx.lineWidth=1;for(let i=-280;i<=280;i+=28){ctx.beginPath();ctx.moveTo(i,-280);ctx.lineTo(i,280);ctx.moveTo(-280,i);ctx.lineTo(280,i);ctx.stroke();}ctx.restore();circle(0,0,230,null,'#5b694847');circle(0,0,158,null,'#52604455');circle(0,0,78,null,'#52604466');ctx.setLineDash([4,10]);circle(0,0,242,null,'#a0b68366');ctx.setLineDash([]);ctx.strokeStyle='#65765266';ctx.beginPath();ctx.moveTo(-15,0);ctx.lineTo(15,0);ctx.moveTo(0,-15);ctx.lineTo(0,15);ctx.stroke();ctx.save();ctx.font='800 77px "Barlow Condensed",sans-serif';ctx.textAlign='center';ctx.fillStyle='#acbf8111';ctx.fillText('VCTCN',0,24);ctx.restore();for(let i=0;i<72;i++){const a=i*Math.PI/36;ctx.strokeStyle=i%6===0?'#c8ff6299':'#66784f66';ctx.lineWidth=i%6===0?2:1;ctx.beginPath();ctx.moveTo(Math.cos(a)*261,Math.sin(a)*261);ctx.lineTo(Math.cos(a)*(i%6===0?270:265),Math.sin(a)*(i%6===0?270:265));ctx.stroke();}ctx.restore();}
function drawTop(t){const x=width/2+t.x*scale,y=height/2+8+t.y*scale*.78,r=t.r*scale;ctx.save();ctx.translate(x,y);ctx.scale(1,.78);ctx.shadowColor='#000b';ctx.shadowBlur=16*scale;ctx.shadowOffsetY=12*scale;circle(3*scale,13*scale,r*.96,'#0a0e0c');ctx.shadowBlur=0;ctx.shadowOffsetY=0;const base=ctx.createLinearGradient(0,-r,0,r);base.addColorStop(0,'#8c9991');base.addColorStop(.45,'#4b584e');base.addColorStop(1,'#111a16');circle(0,5*scale,r,base,'#768571',1.5*scale);circle(0,0,r,'#16221c',t.color,2*scale);ctx.save();ctx.rotate(t.angle);for(let k=0;k<8;k++){ctx.save();ctx.rotate(k*Math.PI/4);ctx.beginPath();ctx.moveTo(r*.48,-r*.28);ctx.lineTo(r*.92,-r*.18);ctx.lineTo(r*.98,r*.1);ctx.lineTo(r*.62,r*.36);ctx.closePath();ctx.fillStyle=t.color;ctx.globalAlpha=.8;ctx.fill();ctx.globalAlpha=1;ctx.beginPath();ctx.moveTo(r*.7,-r*.16);ctx.lineTo(r*.86,-r*.09);ctx.strokeStyle='#fff8';ctx.lineWidth=2*scale;ctx.stroke();ctx.restore();}ctx.restore();circle(0,0,r*.7,'#263126',t.color,1.4*scale);const face=ctx.createRadialGradient(-r*.2,-r*.3,0,0,0,r*.65);face.addColorStop(0,'#53604c');face.addColorStop(1,'#17231b');circle(0,0,r*.62,face,'#ced8af44',scale);ctx.save();ctx.rotate(Math.sin(t.angle*.035)*.08);ctx.fillStyle='#f2f7e3';ctx.font=`800 ${r*.30}px "Barlow Condensed",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(names[t.id],0,1*scale);ctx.fillStyle=t.color;ctx.font=`600 ${r*.14}px "Barlow Condensed",sans-serif`;ctx.fillText('0'+(t.id+1),0,r*.28);ctx.restore();ctx.save();ctx.rotate(t.angle*.8);ctx.strokeStyle=t.color;ctx.globalAlpha=.5;ctx.lineWidth=2*scale;ctx.beginPath();ctx.arc(0,0,r+5*scale,0,Math.PI*.9);ctx.stroke();ctx.restore();if(t.hit>0){ctx.globalAlpha=t.hit*1.5;circle(0,0,r+3*scale,null,'#fff',4*scale);}ctx.restore();}
function drawWhip(w){const limitX=(width/2-30)/scale;w.sx=Math.max(-limitX,Math.min(limitX,w.sx));w.sy=Math.max((95-height/2-8)/(scale*.78),w.sy);const p=1-w.life/w.max,bend=Math.sin(p*Math.PI*2)*70;ctx.globalAlpha=Math.min(1,w.life*5);ctx.lineCap='round';ctx.strokeStyle=w.color;ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(w.sx,w.sy);ctx.lineTo(w.sx+(w.x-w.sx)*.17,w.sy+28);ctx.stroke();ctx.strokeStyle='#142018';ctx.lineWidth=3;ctx.setLineDash([2,5]);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle=w.color;ctx.lineWidth=2.5;ctx.shadowColor=w.color;ctx.shadowBlur=7;ctx.beginPath();ctx.moveTo(w.sx+(w.x-w.sx)*.17,w.sy+28);ctx.bezierCurveTo(w.sx-bend,w.sy+120,w.x+bend,w.y-100,w.x,w.y);ctx.stroke();ctx.shadowBlur=0;}
function drawWhipLabel(w){const x=width/2+w.sx*scale,y=height/2+8+w.sy*scale*.78-20;ctx.save();ctx.globalAlpha=Math.min(1,w.life*5);ctx.fillStyle='#111b16';ctx.strokeStyle=w.color;ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(x-21,y-12,42,24,4);ctx.fill();ctx.stroke();ctx.fillStyle=w.color;ctx.font='700 16px "Barlow Condensed",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(w.name,x,y);ctx.restore();}
function render(){drawField();ctx.save();ctx.translate(width/2,height/2+8);ctx.scale(scale,scale*.78);for(const t of tops){if(t.trail.length>1){ctx.beginPath();t.trail.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle=t.color+'20';ctx.lineWidth=17;ctx.lineCap='round';ctx.stroke();}}for(const r of rings){ctx.globalAlpha=r.life*1.4;circle(r.x,r.y,r.r,null,r.color,2);}ctx.globalAlpha=1;ctx.restore();[...tops].sort((a,b)=>a.y-b.y).forEach(drawTop);ctx.save();ctx.translate(width/2,height/2+8);ctx.scale(scale,scale*.78);whips.forEach(drawWhip);for(const p of sparks){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.strokeStyle=p.color;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.035,p.y-p.vy*.035);ctx.stroke();}ctx.restore();whips.forEach(drawWhipLabel);$('#event').style.opacity=flash>0?'1':'0';}
function frame(now){const dt=Math.min((now-last)/1000||0,.04);last=now;if(!paused){const parts=Math.max(1,Math.ceil(dt/.009));for(let i=0;i<parts;i++)step(dt/parts);}render();requestAnimationFrame(frame);}
$('#strike').onclick=strikeAll;$('#auto').onclick=()=>{auto=!auto;$('#auto').setAttribute('aria-checked',String(auto));};$('#power').oninput=e=>{power=Number(e.target.value)/100;$('#powerValue').value=Math.round(power*100)+'%';};$('#pause').onclick=()=>setPaused(!paused);$('#reset').onclick=()=>{reset();setPaused(false);};$('#sound').onclick=async()=>{sound=!sound;$('#sound').setAttribute('aria-pressed',String(sound));$('#soundLabel').textContent=sound?'击杀音效加载中…':'音效关闭';if(!sound){soundSources.forEach(s=>s.stop());soundSources.clear();return;}try{audio??=new(window.AudioContext||window.webkitAudioContext)();await audio.resume();await loadSounds();if(sound){$('#soundLabel').textContent='击杀音效开启';tone(400);}}catch{sound=false;$('#sound').setAttribute('aria-pressed','false');$('#soundLabel').textContent='加载失败，点击重试';}};
canvas.addEventListener('pointerdown',e=>{const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left-width/2)/scale,y=(e.clientY-rect.top-height/2-8)/(scale*.78);const t=tops.reduce((a,b)=>Math.hypot(a.x-x,a.y-y)<Math.hypot(b.x-x,b.y-y)?a:b);if(paused)setPaused(false);strike(t,true);});document.addEventListener('keydown',e=>{if(['INPUT','BUTTON','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();strikeAll();}if(e.code==='KeyP')setPaused(!paused);});new ResizeObserver(resize).observe(canvas);resize();reset();setPaused(paused);requestAnimationFrame(frame);
window.arenaState=()=>({paused,auto,power,elapsed,collisionCount,sound,audioLoaded:killBuffers.length,lastPlayed,whips:whips.length,activeWhips:whips.map(({name,target,color})=>({name,target,color})),tops:tops.map(({id,x,y,omega})=>({id,x,y,omega,label:names[id],whip:whipNames[names[id]]}))});
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'strike_all_tops',description:'抽打全部四个 VCTCN 陀螺并继续旋转。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||typeof input!=='object'||Object.keys(input).length)throw new Error('Expected an empty object');strikeAll();return window.arenaState();}})).catch(()=>{});}catch{}}
})();
